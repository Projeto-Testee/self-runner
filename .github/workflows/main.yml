name: Fake Self Runner
on:
  workflow_dispatch

jobs:
  teste:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: ./src
